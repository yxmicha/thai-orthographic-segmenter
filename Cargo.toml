[workspace]
members = [
    "thai-syllable-rules",
    "thai-syllable-segmenter",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Micha <220009159+yxmicha@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yxmicha/thai-orthographic-segmenter"
categories = ["text-processing", "internationalization"]

[workspace.dependencies]
burn = { package = "burn-core", version = "=0.22.1", default-features = false, features = ["flex", "std"] }
burn-nn = { version = "=0.22.1", default-features = false, features = ["std"] }
burn-pack = { version = "=0.22.1", default-features = false, features = ["std"] }
cedarwood = "0.6.1"
proptest = "1"
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
regex = "1.13.1"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thai-line-segmenter = { path = "thai-line-segmenter", version = "0.1.0" }
thai-syllable-rules = { path = "thai-syllable-rules", version = "0.1.0" }
thai-syllable-segmenter = { path = "thai-syllable-segmenter", version = "0.1.0" }
thai-word-segmenter = { path = "thai-word-segmenter", version = "0.1.0" }
thiserror = "2.0.21"
winnow = "1.0.5"

# The segmenters' inference loops run about 30 times slower unoptimized, which makes their
# integration tests take minutes in debug builds.
[profile.dev.package.thai-syllable-segmenter]
opt-level = 2

[profile.dev.package.thai-word-segmenter]
opt-level = 2

# Dependency policy, enforced in CI by `cargo deny check` (see .github/workflows/ci.yml).
#
# The graph covers every feature and every target, so the optional `burn` feature of
# `thai-word-segmenter` is held to the same policy as the default build. Most of the exceptions
# below exist only because of that optional Burn tree; the default dependency tree has none.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # `paste` is unmaintained and has no safe upgrade. It is reachable only through Burn's
    # optional `burn` feature (via `gemm`, `pulp` and `burn-dispatch`); the default build does
    # not compile it, and it has no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained macro crate, only behind the optional burn feature" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allow-list of permissive licenses. Entries the current graph does not use are fine: they keep
# the policy stable as dependencies change.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # `colored` (MPL-2.0, file-level copyleft) is a transitive dependency of `burn-tensor`,
    # reachable only through the optional `burn` feature. MPL-2.0 permits linking from
    # permissively licensed code.
    { allow = ["MPL-2.0"], crate = "colored" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Duplicate versions of a crate are denied. The workspace's own direct dependencies are not
# duplicated; every exception below is a third-party tree this repository cannot unify, and
# names the older version so that any new duplicate is still an error.
skip = [
    # `burn-pack` -> `burn-std` -> `cubecl-*`, a dev-dependency of `thai-syllable-segmenter`
    # (the `convert-checkpoint` example) that is outside the published dependency tree.
    { crate = "embedded-hal@0.2.7", reason = "embassy-time via cubecl-environment, from burn-std" },
    { crate = "hashbrown@0.16.1", reason = "burn-std; cubecl uses 0.17" },
    { crate = "syn@2.0.119", reason = "derive-new, derive_more-impl and zerocopy-derive via burn-std; serde and thiserror use 3" },
    # Only behind the optional `burn` feature.
    { crate = "thiserror@1.0.69", reason = "sysctl via gemm, optional burn feature" },
    { crate = "thiserror-impl@1.0.69", reason = "sysctl via gemm, optional burn feature" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

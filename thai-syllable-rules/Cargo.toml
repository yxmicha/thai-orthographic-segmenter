[package]
name = "thai-syllable-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/thai-syllable-rules"
categories.workspace = true
keywords = ["thai", "syllable", "orthography", "nlp", "segmentation"]
description = "Rule-based Thai syllable candidates with explicit uncertainty"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/thai-syllable-rules.rs"

[features]
serde = ["dep:serde"]
test-support = []

[dependencies]
serde = { workspace = true, optional = true }
winnow.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "architecture_contracts"
path = "tests/architecture_contracts.rs"
required-features = ["test-support"]

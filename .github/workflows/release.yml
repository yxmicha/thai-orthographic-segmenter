name: Release

# Builds the Python wheels and the source package and publishes them to PyPI when a `v*` tag
# is pushed. Publishing uses PyPI trusted publishing (no token): register this repository,
# workflow `release.yml` and environment `pypi` as a publisher of `thai-orthographic-segmenter`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          working-directory: thai-segmenter-python
      - uses: actions/upload-artifact@v6
        with:
          name: dist-linux-${{ matrix.target }}
          path: thai-segmenter-python/dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          working-directory: thai-segmenter-python
      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows-x64
          path: thai-segmenter-python/dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: thai-segmenter-python
      - uses: actions/upload-artifact@v6
        with:
          name: dist-macos-${{ matrix.target }}
          path: thai-segmenter-python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: thai-segmenter-python
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: thai-segmenter-python/dist

  publish:
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Files already on PyPI (for example from a manual first upload) are skipped.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

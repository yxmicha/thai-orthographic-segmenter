[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "thai-orthographic-segmenter"
dynamic = ["version"]
description = "Thai syllable, word and line segmentation with bundled models"
readme = "README.md"
requires-python = ">=3.10"
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "LICENSE-UNICODE"]
authors = [{ name = "Micha", email = "220009159+yxmicha@users.noreply.github.com" }]
classifiers = [
    "Natural Language :: Thai",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yxmicha/thai-orthographic-segmenter"
Repository = "https://github.com/yxmicha/thai-orthographic-segmenter"
Issues = "https://github.com/yxmicha/thai-orthographic-segmenter/issues"

[dependency-groups]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "thai_orthographic_segmenter._native"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["thai_orthographic_segmenter"]
